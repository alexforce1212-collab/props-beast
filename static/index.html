:root {
  --bg: #04070a;
  --surface: #0a1116;
  --surface-2: #0e161d;
  --surface-3: #121c25;
  --line: #1b2833;
  --line-soft: #14202b;
  --neon: #00FF88;
  --neon-dim: #14b86a;
  --neon-glow: rgba(0, 255, 136, 0.35);
  --text: #eef7f1;
  --text-dim: #8fa3b0;
  --text-faint: #55676f;
  --win: #00FF88;
  --loss: #ff5470;
  --amber: #ffc44d;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #04070a;
    --surface: #0a1116;
  }
}

* {
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
}

.font-terminal {
  font-family: "Arial Narrow", "Helvetica Neue Condensed", "HelveticaNeue-CondensedBold",
    Impact, sans-serif;
  letter-spacing: 0.02em;
}

.font-mono-num {
  font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo,
    Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

/* ambient terminal grid backdrop */

.terminal-grid {
  background-image:
    linear-gradient(rgba(0, 255, 136, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 136, 0.045) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, black 30%, transparent 75%);
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.live-dot {
  animation: live-ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
}

@keyframes live-ping {
  0% {
    box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7);
  }

  70% {
    box-shadow: 0 0 0 7px rgba(0, 255, 136, 0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(0, 255, 136, 0);
  }
}

.ticker-scroll {
  animation: ticker 28s linear infinite;
}

@keyframes ticker {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}

.card-enter {
  animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.99);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.bar-fill {
  animation: bar-grow 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  transform-origin: left center;
}

@keyframes bar-grow {
  from {
    transform: scaleX(0);
  }

  to {
    transform: scaleX(1);
  }
}

.score-ring {
  background: conic-gradient(
    var(--neon) calc(var(--p) * 1%),
    rgba(0, 255, 136, 0.14) 0
  );
}

.tab-active-glow {
  box-shadow: 0 0 18px rgba(0, 255, 136, 0.35),
    inset 0 0 12px rgba(0, 255, 136, 0.12);
}

.rank-top {
  text-shadow: 0 0 22px var(--neon-glow);
}

.placeholder\:text-\[var\(--text-faint\)\]::-moz-placeholder {
  color: var(--text-faint);
}

.placeholder\:text-\[var\(--text-faint\)\]::placeholder {
  color: var(--text-faint);
}

}

.active\:scale-\[0\.97\]:active {
  --tw-scale-x: 0.97;
  --tw-scale-y: 0.97;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

@media (min-width: 640px) {
  .sm\:col-span-3 {
    grid-column: span 3 / span 3;
  }

  .sm\:flex {
    display: flex;
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
